<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости и тренды — Престиж Мебель</title>
<style>
  /* ... (здесь можно использовать ваши стили с других страниц) ... */
  body { font-family: 'Montserrat', sans-serif; background: #0b0f10; color: #fff; }
  .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
  .news-card { background: #1c1c1a; border-radius: 14px; overflow: hidden; }
  .news-card img { width: 100%; height: 200px; object-fit: cover; }
  .news-card-content { padding: 20px; }
  .news-card h3 { font-size: 18px; margin-bottom: 10px; }
  .news-card h3 a { color: #fff; text-decoration: none; }
  .news-card h3 a:hover { color: #cba365; }
  .news-card .source { font-size: 12px; color: #cba365; text-transform: uppercase; }
  .news-card .date { font-size: 12px; color: #8a8f94; margin-top: 5px; }
  .loading { text-align: center; padding: 60px; color: #cba365; }
</style>
</head>
<body>
  <!-- Здесь ваш header -->
  
  <h1 style="text-align:center; padding: 100px 20px 20px; color:#cba365;">Новости и тренды</h1>
  <p style="text-align:center; color:#c9cdcb; margin-bottom: 40px;">Актуальные события из мира мебели и дизайна</p>
  
  <div class="news-grid" id="newsContainer">
    <div class="loading">Загрузка новостей...</div>
  </div>

  <script>
    async function loadNews() {
      const container = document.getElementById('newsContainer');
      try {
        const response = await fetch('news.json');
        const news = await response.json();
        
        if (news.length === 0) {
          container.innerHTML = '<div class="loading">Пока нет новостей</div>';
          return;
        }

        container.innerHTML = news.map(item => `
          <div class="news-card">
            ${item.image ? `<img src="${item.image}" alt="${item.title}" onerror="this.style.display='none'">` : ''}
            <div class="news-card-content">
              <div class="source">${item.source}</div>
              <h3><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h3>
              <div class="date">${new Date(item.pubDate).toLocaleDateString('ru-RU')}</div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        container.innerHTML = '<div class="loading">Не удалось загрузить новости. Попробуйте позже.</div>';
      }
    }
    loadNews();
  </script>
</body>
</html>
